  <path d="M186 108v296" stroke="#444441" stroke-width="22"/>
  <path d="M228 200h78M228 256h78" stroke="#444441" stroke-width="22" stroke-linecap="round"/>
  <rect x="332" y="138" width="56" height="80" rx="12" fill="#0F6E56"/>
  <rect x="332" y="232" width="56" height="64" rx="12" fill="#BA7517"/>
  <rect x="332" y="310" width="56" height="54" rx="12" fill="#D85A30"/>
