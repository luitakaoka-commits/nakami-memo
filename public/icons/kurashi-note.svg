<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- くらしノート（3アプリをまとめてインストールしたときのアイコン）。
       3冊（お金管理・なかみメモ・つくりおきノート）を1冊に綴じたノートと、3色のしおり。
       PNG は scripts/render-icons.mjs でこのファイルから作る。ここを直したら PNG も作り直すこと。
       中身は中心から半径200px以内に収めてある（maskable の安全領域は半径約205px）。 -->
  <rect width="512" height="512" fill="#F1EFE8"/>
