<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>お金管理 — UI試作</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css?v=glass-notes">
  <script src="notices.js?v=glass-notes" defer></script>
  <script src="mail.js?v=operation-notes" defer></script>
  <script src="plans.js?v=operation-notes" defer></script>
  <script src="overview.js?v=glass-notes" defer></script>
  <script src="extras.js?v=operation-notes" defer></script>
  <script src="app.js?v=glass-notes" defer></script>
</head>
<body>
  <div class="prototype-notice">UI試作</div>
  <header class="app-header">
    <button class="icon-button" id="menu-open" aria-label="メニューを開く" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <strong id="screen-name">資金繰り・試算</strong>
    <span class="header-caption">お金管理</span>
  </header>
  <main id="main" tabindex="-1">
    <div class="page-heading"><div><p class="eyebrow">11月9日（月）</p><h1 id="page-title">資金繰り・試算</h1></div></div>
    <section id="cashflow-screen" aria-label="資金繰り・試算"><div id="balance-content"></div></section>
    <section id="forecast-screen" aria-label="支払いの見通し" hidden><div id="forecast-content"></div></section>
    <section id="mail-screen" aria-label="メール確認" hidden></section>
    <section id="plans-screen" aria-label="予定" hidden></section>
    <section id="records-screen" aria-label="記録" hidden></section>
    <section id="accounts-screen" aria-label="口座・カード" hidden></section>
    <section id="shift-screen" aria-label="シフト・給与" hidden></section>
    <section id="receipts-screen" aria-label="レシート" hidden></section>
    <section id="review-screen" aria-label="ふりかえり・ムダ支出" hidden></section>
    <section id="recurring-screen" aria-label="定期支払い" hidden></section>
    <section id="settings-screen" aria-label="設定" hidden></section>
  </main>
  <details class="preview-tools"><summary>表示状態</summary><div class="tool-content"><label for="preview-state">状態</label><select id="preview-state"><option value="normal">通常</option><option value="shortfall">不足</option><option value="empty">データなし</option><option value="loading">読込中</option><option value="offline">オフライン</option><option value="error">エラー</option><option value="success">保存完了</option></select></div></details>
  <dialog id="sidebar" class="sidebar" aria-labelledby="sidebar-title">
    <div class="sidebar-heading"><div><p class="eyebrow">お金管理</p><h2 id="sidebar-title">メニュー</h2></div><button id="menu-close" class="icon-button" aria-label="メニューを閉じる">×</button></div>
    <nav id="menu-items" aria-label="メインとサブのメニュー"></nav>
  </dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div class="dialog-heading"><h2 id="detail-title"></h2><button class="icon-button" data-close-detail aria-label="詳細を閉じる">×</button></div><div id="detail-body"></div><button class="primary-button" data-close-detail>閉じる</button></dialog>
  <dialog id="plan-editor" class="detail-dialog" aria-labelledby="plan-editor-title">
    <div class="dialog-heading"><h2 id="plan-editor-title">予定を追加</h2><button type="button" class="icon-button" data-plan-close aria-label="閉じる">×</button></div>
    <form class="mail-fields">
      <input type="hidden" name="id">
      <label>日付<input type="date" name="date" required></label>
      <label>メモ<input name="name" maxlength="80" required></label>
      <label>種類<select name="kind"><option value="payment">支払い</option><option value="income">収入</option><option value="saving">貯金</option><option value="nisa">NISA</option><option value="reimbursement">立替回収</option><option value="transfer">振込</option></select></label>
      <label>金額<input name="amount" type="number" min="1" step="1" inputmode="numeric" required></label>
      <label>カテゴリ<select name="category"><option>生活費</option><option>固定費</option><option>食費</option><option>交通</option><option>娯楽</option><option>医療</option><option>給与</option><option>収入</option><option>その他</option></select></label>
      <label>うち立替（任意）<input name="lending" type="number" min="0" step="1" inputmode="numeric"></label>
      <label class="asset-check"><input name="exclude" type="checkbox">使える額の計算から除外</label>
      <button class="text-button" type="button" data-plan-close>キャンセル</button>
      <div id="plan-operation-note"></div>
      <button class="primary-button" type="submit">保存</button>
    </form>
  </dialog>
  <dialog id="shift-editor" class="detail-dialog" aria-labelledby="shift-editor-title">
    <div class="dialog-heading"><h2 id="shift-editor-title">シフト</h2><button type="button" class="icon-button" data-shift-close aria-label="閉じる">×</button></div>
    <form class="mail-fields">
      <label>勤務日<input type="date" name="date" required></label>
      <label>状態<select name="status"><option value="worked">勤務済み</option><option value="planned">勤務予定</option></select></label>
      <label>勤務時間<input type="number" name="hours" min="0.25" max="24" step="0.25" inputmode="decimal" placeholder="0" required><small>15分は0.25、30分は0.5で入力</small></label>
      <label>この日だけ時給を変更（任意）<input type="number" name="rate" min="0" step="1" inputmode="numeric" placeholder="基本時給を使用"></label>
      <label>メモ<input type="text" name="memo" maxlength="60" placeholder="例：夕方シフト"></label>
      <button class="primary-button" type="submit">保存</button>
      <button class="text-button" type="button" data-shift-close>キャンセル</button>
      <button class="text-button" type="button" data-shift-delete>削除</button>
    </form>
  </dialog>
  <dialog id="asset-editor" class="detail-dialog" aria-labelledby="asset-editor-title">
    <div class="dialog-heading"><h2 id="asset-editor-title"></h2><button type="button" class="icon-button" data-asset-close aria-label="閉じる">×</button></div>
    <form class="mail-fields"></form>
  </dialog>
  <dialog id="extra-editor" class="detail-dialog" aria-labelledby="extra-editor-title">
    <div class="dialog-heading"><h2 id="extra-editor-title"></h2><button type="button" class="icon-button" data-extra-close aria-label="閉じる">×</button></div>
    <form class="mail-fields"></form>
  </dialog>
  <dialog id="operation-dialog" class="detail-dialog" aria-labelledby="operation-title" aria-describedby="operation-message">
    <h2 id="operation-title"></h2>
    <form class="mail-fields">
      <p id="operation-message" class="note-glass"></p>
      <label hidden>残高への反映<select name="reflected" required></select></label>
      <button class="primary-button" type="submit">確認</button>
      <button class="text-button" type="button" data-operation-cancel>キャンセル</button>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
</body>
</html>
