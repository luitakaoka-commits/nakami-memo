<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計算テスト｜財務管理アプリ</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1b1d21; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  #summary { padding: 12px 16px; border-radius: 10px; font-weight: 600; margin-bottom: 16px; }
  #summary.pass { background: #e6f6ec; color: #12633a; }
  #summary.fail { background: #fdecec; color: #8a1c1c; }
  ol { padding-left: 20px; margin: 0; }
  li { padding: 6px 0; border-bottom: 1px solid #e6e8ec; font-size: 14px; }
  li.pass::marker { color: #12633a; }
  li.fail { color: #8a1c1c; }
  .msg { display: block; font-size: 12px; color: #8a1c1c; margin-top: 4px; white-space: pre-wrap; }
  pre { background: #fff; padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>finance-engine 計算テスト</h1>
<div id="summary">実行中…</div>
<ol id="results"></ol>
<pre id="json"></pre>
<script src="finance-engine.js"></script>
<script src="tests/finance-engine.tests.js"></script>
<script>
  (function () {
    var cases = window.FinanceEngineTests.createSuite(window.FinanceEngine);
    var list = document.getElementById('results');
    var failures = [];
    var passed = 0;
    cases.forEach(function (item) {
      var li = document.createElement('li');
      try {
        item.fn();
        passed += 1;
        li.className = 'pass';
        li.textContent = item.name;
      } catch (error) {
        failures.push({ name: item.name, message: error.message });
        li.className = 'fail';
        li.textContent = item.name;
        var span = document.createElement('span');
        span.className = 'msg';
        span.textContent = error.message;
        li.appendChild(span);
      }
      list.appendChild(li);
    });
    var summary = document.getElementById('summary');
    summary.className = failures.length ? 'fail' : 'pass';
    summary.textContent = failures.length
      ? passed + ' / ' + cases.length + ' 件成功（' + failures.length + ' 件失敗）'
      : passed + ' / ' + cases.length + ' 件すべて成功';
    document.getElementById('json').textContent = JSON.stringify({
      suite: 'finance-engine', total: cases.length, passed: passed, failed: failures.length, failures: failures
    }, null, 2);
  })();
</script>
</body>
</html>
