<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="レシピと献立をアカウントに保存して、スマホでもパソコンでも同じ内容を見られる個人用アプリ" />
    <title>つくりおきノート</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="つくりおきノート" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../shared/app-switcher.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <div class="topbar-wrap">
        <header class="topbar" id="topbar"></header>
        <div id="net-banner" role="status" aria-live="polite"></div>
      </div>
      <main id="main-content" tabindex="-1"></main>
      <nav class="bottom-nav" id="bottom-nav" aria-label="メインナビゲーション" hidden></nav>
    </div>
    <div id="modal-root"></div>
    <div id="toast-region" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
    <script type="module">
      /* 3アプリ共通の切り替えバー。app.js の再描画に巻き込まれないよう、body直下に置く。 */
      import { mountAppSwitcher } from "../shared/app-switcher.js";
      mountAppSwitcher({ current: "recipe" });
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
