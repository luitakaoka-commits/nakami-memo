<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F1EFE8">
  <title>くらしノート</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/kurashi-note-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/kurashi-note-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="くらしノート">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F1EFE8;
      font-family: system-ui, sans-serif; color: #444441; }
    a { color: #0F6E56; }
  </style>
</head>
<body>
  <!-- くらしノートの起動ページ（manifest の start_url）。最後に開いていたアプリへすぐ移る。
       replace なので、戻るボタンでこのページに戻ってこない。 -->
  <p id="fallback" hidden><a href="/money/index.html">お金管理を開く</a></p>
  <script type="module">
    import { readLastApp, startUrlFor } from "/shared/last-app.js";
    location.replace(startUrlFor(readLastApp()));
  </script>
  <script>
    /* モジュールが読めなかったときだけ、手で開けるリンクを出す。 */
    setTimeout(function () { document.getElementById("fallback").hidden = false; }, 3000);
  </script>
</body>
</html>
