name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # money / recipe / app-switcher のテスト。ビルドより速く落ちるので先に回す。
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        # CIのビルドは「通るか」の確認で、どこにもデプロイしない（本番は Vercel が自前でビルドする）。
        # 値が空だと prerender が auth/invalid-api-key で落ちるので、Secrets が無ければ形だけのダミーを使う。
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-dummy-api-key' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci-dummy.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ci-dummy' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'ci-dummy.appspot.com' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:000000000000:web:ci' }}
          # アップロードAPIが実行時に参照する。未設定でもビルド自体は通る。
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      # ビルドしたものを実際に起動して、3アプリが「ページとして」配信されるか確かめる。
      # 200が返るかではなく、HTMLが参照する相対URLをブラウザと同じ手順で取りに行く。
      # NEXT_PUBLIC_* はビルド時に埋め込み済みなので、起動側に環境変数は要らない。
      - name: Serving check
        run: |
          npm start &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          BASE=http://127.0.0.1:3000 node public/shared/serving-check.mjs

      # お金管理を実際のブラウザで操作して確かめる25項目。Firebase には繋がず、スタブで動かす。
      - name: Install Chromium for UI test
        run: npx playwright install --with-deps chromium

      - name: UI test (money)
        run: npm run test:ui
